{% extends 'base_staff.html' %}
{% block title %}Add / Edit Patient{% endblock %}
{% block body %}<div class="section-heading"><div><h1>Add / Edit Patient</h1></div></div><div class="card"><h3>Patient details</h3><form method="post" class="form2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label>Full name</label><input name="name" required value="{{p.name if p else ''}}"></div><div><label>Patient ID</label><input name="patient_id" required value="{{p.patient_id if p else ''}}" placeholder="HK-2026-0143"></div><div><label>Birthdate</label><input type="date" name="birthdate" value="{{p.birthdate if p else ''}}"></div><div><label>Contact number</label><input name="phone" value="{{p.phone if p else ''}}"></div><div class="wide"><label>Email</label><input type="email" name="email" value="{{p.email if p else ''}}"></div><div class="wide"><label>Address</label><textarea name="address">{{p.address if p else ''}}</textarea></div><div class="wide"><label>Preferred reminder channel</label><select name="channel"><option>SMS</option><option>Email</option></select></div><div class="wide actions"><button class="btn primary">Save Patient</button><a class="btn" href="{{url_for('patients')}}">Cancel</a></div></form></div>{% endblock %}
