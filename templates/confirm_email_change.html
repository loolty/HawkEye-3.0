{% extends 'base_staff.html' %}
{% block title %}Confirm new email{% endblock %}
{% block body %}<h1>Confirm new email</h1>
<p class="muted">Enter the 6-digit code sent to <strong>{{ new_email }}</strong>. It expires in 10 minutes.</p>
<div class="card"><p>{{ target.name }}: {{ target.email }} → <strong>{{ new_email }}</strong></p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="code">Confirmation code</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" placeholder="123456" required autofocus><br><br><button class="btn primary" type="submit">Confirm change</button></form>
<form method="post" action="{{ url_for('cancel_user_email_change') }}" style="margin-top:10px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn" type="submit">Cancel</button></form></div>{% endblock %}
