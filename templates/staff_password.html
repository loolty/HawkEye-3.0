{% extends 'base_staff.html' %}
{% block title %}Change password{% endblock %}
{% block body %}<div class="section-heading"><div><h1>Change password</h1><p class="muted">Use at least 8 characters. You will stay signed in.</p></div></div><div class="card" style="max-width:480px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required><p><button class="btn primary">Update password</button></p></form></div>{% endblock %}
