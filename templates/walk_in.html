{% extends 'base_staff.html' %}
{% block title %}Add walk-in patient{% endblock %}
{% block body %}<div class="section-heading"><div><h1>Add walk-in patient</h1><p class="muted">Record an unscheduled patient visit for today. A clinic session log is created automatically.</p></div></div><div class="card"><form method="post" class="form2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="wide"><label>Existing patient (optional)</label><select name="patient_id"><option value="">New patient / enter details below</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}} · {{p.patient_id}}</option>{% endfor %}</select></div><div><label>New patient's full name</label><input name="name" placeholder="Required if no existing patient is selected"></div><div><label>Phone</label><input name="phone" type="tel"></div><div class="wide"><label>Email</label><input name="email" type="email"></div><div class="wide"><label>Visit type</label><select name="type"><option>Eye check</option><option>Follow-up</option><option>Prescription review</option></select></div><div class="wide actions"><button class="btn primary">Save walk-in visit</button><a class="btn" href="{{url_for('patients')}}">Cancel</a></div></form></div>{% endblock %}
